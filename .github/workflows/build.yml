name: Update README cards

on:
  schedule:
    # 每天 UTC 时间 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=chanhanzhan&show_icons=true&include_all_commits=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=chanhanzhan&layout=compact&langs_count=6&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate pin card - Microsoft-Rewards
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=chanhanzhan&repo=Microsoft-Rewards&theme=tokyonight
          path: profile/pin-chanhanzhan-Microsoft-Rewards.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate pin card - Telegram-Bot-go
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=chanhanzhan&repo=Telegram-Bot-go&theme=tokyonight
          path: profile/pin-chanhanzhan-Telegram-Bot-go.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate pin card - business2api
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=XxxXTeam&repo=business2api&theme=tokyonight
          path: profile/pin-XxxXTeam-business2api.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate pin card - flowith2api_deno
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=XxxXTeam&repo=flowith2api_deno&theme=tokyonight
          path: profile/pin-XxxXTeam-flowith2api_deno.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate pin card - chatai-plugin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=XxxXTeam&repo=chatai-plugin&theme=tokyonight
          path: profile/pin-XxxXTeam-chatai-plugin.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards [skip ci]" || exit 0
          git push
